<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 11 — Thư viện ảnh (figure / figcaption)</title>
    <link rel="stylesheet" href="bai11.css">
</head>

<body>
    <header>
        <h1>Thư viện việt nam</h1>
        <p>Bộ sưu tập 6 danh thắng tiêu biểu - minh họa thẻ figure/figcaption.</p>
    </header>
    <main class="gallery-grid">
        <figure>
            <img src="1-vinh-ha-long.jpg" alt="vịnh hạ long">
            <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
        </figure>
        <figure>
            <img src="2-son-doong.jpg" alt="vịnh hạ long">
            <figcaption>Hình 2. Hang sơn Doong</figcaption>
        </figure>
        <figure>
            <img src="3-thac-ban-gioc.jpg" alt="vịnh hạ long">
            <figcaption>Hình 3. Thác Bản Giốc</figcaption>
        </figure>
        <figure>
            <img src="4-fansipan.jpg" alt="vịnh hạ long">
            <figcaption>Hình 4. Fansipan</figcaption>
        </figure>
        <figure>
            <img src="5-mekong.jpg" alt="vịnh hạ long">
            <figcaption>Hình 5. Mekong</figcaption>
        </figure>
        <figure>
            <img src="6-phong-nha.jpg" alt="vịnh hạ long">
            <figcaption>Hình 6. Phong nha</figcaption>
        </figure>
    </main>
</body>

</html>
