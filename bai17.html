<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 17 - Kiểm tra biểu mẫu bằng JavaScript</title>
    <link rel="stylesheet" href="bai17.css">
</head>
<body>

    <div class="form-container">
        <div class="header">
            <h1>Đăng ký tài khoản</h1>
            <p>Dữ liệu được kiểm tra bằng JavaScript trước khi gửi.</p>
        </div>

        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="fullname">Họ và tên</label>
                <input type="text" id="fullname" placeholder="Nhập họ và tên...">
                <small class="message"></small>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Nhập địa chỉ email...">
                <small class="message"></small>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu...">
                <small class="message"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu...">
                <small class="message"></small>
            </div>

            <button type="submit" id="submitBtn">Đăng ký</button>
        </form>
    </div>

    <script src="bai17.js"></script>
</body>
</html>
