<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>In lịch</title>
    <!-- Nhúng file CSS bên ngoài -->
    <link rel="stylesheet" href="bai12.css">
</head>
<body>
 <div class="container">
    <div class="calendar-box">
        <div id="h-year" class="year">2026</div>
        <div id="h-month" class="month">12</div>
        <div id="h-day" class="day-number">24</div>
        <div id="h-weekday" class="weekday">Thứ 2</div>
    </div>
    <div id="h-greeting" class="greeting">Chào buổi sáng!</div>
    <div class="form-box">
        <div class="input-group">
            <label for="txtDay">Ngày</label>
            <input type="text" id="txtDay" value="24">
        </div>
    </div>
        <div class="input-group">
            <label for="txtMonth">Tháng</label>
            <input type="text" id="txtMonth" value="12">
        </div>
      <div class="input-group">
            <label for="txtYear">Năm</label>
            <input type="text" id="txtYear" value="2026">
        </div>
        <button id="btnPrint">In lịch</button>
 </div>
    <script src="bai12.js"></script>
</body>
</html>
