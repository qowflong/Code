<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 20 - Hiệu ứng ảnh với CSS Filter</title>
    <link rel="stylesheet" href="bai20.css">
</head>
<body>

    <div class="app-container">
        <h1 class="page-title">Bài 20 — Hiệu ứng ảnh với CSS Filter</h1>

        <div class="display-box">
            <div class="image-card">
                <img id="effectImage" src="hoahong.gif" alt="Hoa hồng">
                <p class="image-text">Special For You</p>
            </div>

            <div class="button-grid">
                <button class="effect-btn active" onclick="applyEffect('gray', this)">Gray</button>
                <button class="effect-btn" onclick="applyEffect('xray', this)">Xray</button>
                <button class="effect-btn" onclick="applyEffect('invert', this)">Invert</button>
                <button class="effect-btn" onclick="applyEffect('fliph', this)">FlipH</button>
                <button class="effect-btn" onclick="applyEffect('flipv', this)">FlipV</button>
                <button class="effect-btn" onclick="applyEffect('glow', this)">Glow</button>
                <button class="effect-btn" onclick="applyEffect('shadow', this)">Shadow</button>
                <button class="effect-btn" onclick="applyEffect('boldshadow', this)">Bold Shadow</button>
                <button class="effect-btn" onclick="applyEffect('dropshadow', this)">DropShadow</button>
                <button class="effect-btn" onclick="applyEffect('blur', this)">Blur</button>
                <button class="effect-btn" onclick="applyEffect('wave', this)">Wave</button>
                <button class="effect-btn" onclick="applyEffect('mask', this)">Mask</button>
                <button class="effect-btn" onclick="applyEffect('alpha', this)">Alpha</button>
            </div>
        </div>
    </div>

    <svg style="display: none;">
        <filter id="waveFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.05 0.15" numOctaves="2" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <script src="bai20.js"></script>
</body>
</html>
