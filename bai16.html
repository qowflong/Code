<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 16 - Danh sách việc cần làm</title>
    <link rel="stylesheet" href="bai16.css">
</head>
<body>
    <div class="todo-app">
        <div class="header">
            <h1>Danh sách việc cần làm</h1>
            <p>Thêm việc mới, đánh dấu hoàn thành hoặc xoá — tất cả bằng JavaScript.</p>
        </div>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Nhập việc cần làm...">
            <button id="addBtn">Thêm</button>
        </div>

        <ul id="taskList" class="task-list"></ul>

        <div class="footer">
            <span id="taskCount">Còn 0 việc chưa hoàn thành</span>
        </div>
    </div>

    <script src="bai16.js"></script>
</body>
</html>
